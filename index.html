<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CC Finds</title>

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <style>
        /* Cada variável vira uma chave da aba Config */
        :root {
            --bg: #EEF2F0;
            --side: #fff;
            --card: #fff;
            --card2: #F1F5F3;
            --line: #DDE5E1;
            --acc: #16A34A;
            --acc2: #0f9f85;
            --hot: #E8590C;
            --tx: #1d2622;
            --mut: #66736d;
            --r: 22px;
            --sh: 0 6px 22px rgba(30, 50, 40, .08);
            --ban: linear-gradient(120deg, #0f8f52, #22b573 55%, #6fe3c0);
            --bant: #fff;
            --onacc: #fff;
            --fh: 'Baloo 2', 'Trebuchet MS', sans-serif;
            --fb: 'Nunito', 'Segoe UI', sans-serif;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        :root[data-theme="dark"] {
            --bg: #1B1E21;
            --side: #22262A;
            --card: #272B2F;
            --card2: #30353A;
            --line: #3A4046;
            --acc: #4ADE80;
            --acc2: #7FE5C8;
            --hot: #FF8A3D;
            --tx: #EDF1F0;
            --mut: #9AA4A9;
            --sh: 0 6px 22px rgba(0, 0, 0, .25);
            --ban: linear-gradient(120deg, #2c3237, #3b4248);
            --bant: #EDF1F0;
            --onacc: #0b2415
        }

        html {
            height: 100%
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 400 15px/1.5 var(--fb);
            min-height: 100%
        }

        h1,
        h2,
        h3 {
            font-family: var(--fh);
            margin: 0;
            line-height: 1.1
        }

        a {
            color: inherit;
            text-decoration: none
        }

        svg.i {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: none
        }

        .side {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 250px;
            background: var(--side);
            border-right: 1px solid var(--line);
            padding: 22px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: auto
        }

        .logo {
            padding: 0 10px 18px
        }

        .logo b {
            font: 800 28px/1 var(--fh);
            display: flex;
            gap: 8px;
            align-items: center
        }

        .logo b i {
            width: 22px;
            height: 22px;
            background: var(--acc);
            clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%)
        }

        .logo small {
            color: var(--mut);
            font-size: 12px;
            margin-left: 30px
        }

        .side h4 {
            margin: 18px 10px 6px;
            font: 700 12px var(--fb);
            color: var(--mut)
        }

        .side a {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 12px;
            border-radius: 14px;
            font-weight: 700;
            color: var(--mut)
        }

        .side a em {
            margin-left: auto;
            font: 700 12px var(--fb);
            font-style: normal;
            background: var(--card2);
            padding: 1px 9px;
            border-radius: 99px
        }

        .side a.on {
            background: var(--card2);
            color: var(--tx);
            box-shadow: inset 3px 0 0 var(--acc)
        }

        .side a.on svg,
        .side a:hover svg {
            color: var(--acc)
        }

        .side a:hover {
            background: var(--card2)
        }

        .page {
            margin-left: 250px;
            min-height: 100vh;
            display: flex;
            flex-direction: column
        }

        .top {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 14px 28px;
            position: sticky;
            top: 0;
            z-index: 5;
            background: color-mix(in srgb, var(--bg) 90%, transparent);
            backdrop-filter: blur(10px)
        }

        .top a {
            padding: 8px 14px;
            border-radius: 99px;
            font-weight: 700;
            color: var(--mut)
        }

        .top a.on,
        .top a:hover {
            background: var(--card);
            color: var(--acc);
            box-shadow: var(--sh)
        }

        .sr {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 99px;
            padding: 9px 16px;
            width: 320px;
            color: var(--mut)
        }

        .sr kbd {
            margin-left: auto;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0 6px;
            font: inherit;
            font-size: 12px
        }

        .ic {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--tx);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            cursor: pointer;
            margin-left: 6px
        }

        .ic:focus-visible,
        .mk button:focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 2px
        }

        .mg {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 310px;
            gap: 20px;
            padding: 6px 28px 40px;
            flex: 1;
            align-content: start
        }

        .mg.b .sd {
            grid-column: 2;
            grid-row: 1/span 2
        }

        .ban {
            grid-column: 1/-1;
            margin-top: 56px;
            height: 150px;
            border-radius: 28px;
            background: var(--ban);
            color: var(--bant);
            position: relative;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: var(--sh);
            border: 1px solid var(--line)
        }

        .mg.b .ban {
            grid-column: 1
        }

        .ban h1 {
            font-size: 34px
        }

        .ban p {
            margin: 6px 0 12px;
            max-width: 380px;
            opacity: .92
        }

        .pills {
            display: flex;
            gap: 8px
        }

        .pills span {
            background: rgba(255, 255, 255, .2);
            border: 1px solid rgba(255, 255, 255, .3);
            padding: 3px 12px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 13px
        }

        :root[data-theme="dark"] .pills span {
            background: var(--card);
            border-color: var(--line)
        }

        :root[data-theme="dark"] .pills b {
            color: var(--acc)
        }

        .ban .o {
            position: absolute;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .35)
        }

        :root[data-theme="dark"] .ban .o {
            border-color: var(--acc);
            opacity: .5
        }

        .luma {
            position: absolute;
            right: 50px;
            bottom: 0;
            height: 215px;
            filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .25));
            pointer-events: none
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 18px;
            box-shadow: var(--sh)
        }

        .hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px
        }

        .hd h2 {
            font-size: 21px
        }

        .hd a {
            color: var(--mut);
            font-weight: 700;
            font-size: 13px
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px
        }

        .chips span {
            padding: 6px 13px;
            border-radius: 99px;
            background: var(--card2);
            font-weight: 700;
            font-size: 13px;
            color: var(--mut)
        }

        .chips .on {
            background: var(--acc);
            color: var(--onacc)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 16px
        }

        .th {
            aspect-ratio: 1;
            border-radius: 18px;
            position: relative;
            margin-bottom: 9px
        }

        .cc h3 {
            font-size: 16px
        }

        .cc small {
            color: var(--mut)
        }

        .tag {
            position: absolute;
            top: 9px;
            left: 9px;
            font: 800 11px var(--fb);
            padding: 4px 10px;
            border-radius: 99px;
            background: rgba(0, 0, 0, .55);
            color: #fff;
            display: flex;
            gap: 5px;
            align-items: center
        }

        .tag.e {
            background: var(--hot);
            color: #2a1100
        }

        .fav {
            position: absolute;
            right: 9px;
            bottom: 9px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .45);
            color: #fff;
            display: grid;
            place-items: center
        }

        .g1 {
            background: linear-gradient(145deg, #7fe5c8, #2d8f6b)
        }

        .g2 {
            background: linear-gradient(145deg, #f6d6b0, #c47a45)
        }

        .g3 {
            background: linear-gradient(145deg, #b6e08a, #4d9a3a)
        }

        .g4 {
            background: linear-gradient(145deg, #2b3e5a, #6b86b3)
        }

        .g5 {
            background: linear-gradient(145deg, #e8c1d6, #a85c86)
        }

        .g6 {
            background: linear-gradient(145deg, #3a2f52, #8f6bd1)
        }

        .sd {
            display: grid;
            gap: 18px;
            align-content: start
        }

        .row {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 8px;
            border-radius: 16px;
            background: var(--card2);
            margin-bottom: 9px
        }

        .row:last-child {
            margin: 0
        }

        .row .m {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            flex: none
        }

        .row b {
            display: block;
            font-size: 14px
        }

        .row small {
            color: var(--mut)
        }

        .row .bt {
            margin-left: auto;
            background: var(--hot);
            color: #2a1100;
            font: 800 11px var(--fb);
            padding: 5px 10px;
            border-radius: 99px
        }

        .au {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 5px 2px
        }

        .au .a {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--acc2)
        }

        .au small {
            color: var(--mut);
            display: block;
            line-height: 1.2
        }

        .ft {
            display: flex;
            gap: 18px;
            align-items: center;
            padding: 18px 28px;
            border-top: 1px solid var(--line);
            color: var(--mut);
            font-size: 13px
        }

        .ft a {
            font-weight: 700;
            color: var(--acc)
        }

        .ft .r {
            margin-left: auto
        }

        .mk {
            position: fixed;
            right: 16px;
            bottom: 16px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 99px;
            padding: 5px;
            display: flex;
            gap: 4px;
            align-items: center;
            font-size: 12px;
            box-shadow: var(--sh);
            z-index: 9
        }

        .mk span {
            padding: 0 8px;
            color: var(--mut)
        }

        .mk button {
            border: 0;
            border-radius: 99px;
            padding: 6px 12px;
            font: 700 12px var(--fb);
            cursor: pointer;
            background: var(--card2);
            color: var(--tx)
        }

        .mk button.on {
            background: var(--acc);
            color: var(--onacc)
        }

        @media(max-width:1100px) {
            .side {
                display: none
            }

            .page {
                margin: 0
            }

            .mg {
                grid-template-columns: 1fr
            }

            .mg.b .sd {
                grid-column: 1;
                grid-row: auto
            }

            .sr {
                width: 180px
            }
        }

        .mg.pg {
            display: none
        }

        .mg.pg.on {
            display: grid
        }

        .lb {
            display: block;
            font-weight: 700;
            color: var(--mut);
            margin: 14px 0 6px;
            font-size: 12px
        }

        .lb:first-child {
            margin-top: 0
        }

        .fld {
            display: flex;
            justify-content: space-between;
            background: var(--card2);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 8px 12px;
            color: var(--mut);
            font-weight: 700;
            font-size: 13px
        }

        .chips span {
            cursor: pointer
        }

        .ban.av {
            padding-left: 160px
        }

        .avb {
            position: absolute;
            left: 38px;
            top: 50%;
            transform: translateY(-50%);
            width: 92px;
            height: 92px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, .6)
        }

        .gal {
            aspect-ratio: 16/9;
            border-radius: 20px;
            position: relative
        }

        .nv {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 0;
            background: rgba(0, 0, 0, .5);
            color: #fff;
            display: grid;
            place-items: center;
            cursor: pointer
        }

        .nv.l {
            left: 12px
        }

        .nv.r {
            right: 12px
        }

        .cnt {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: rgba(0, 0, 0, .5);
            color: #fff;
            border-radius: 99px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 700
        }

        .thumbs {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 12px
        }

        .thumbs div {
            aspect-ratio: 16/9;
            border-radius: 12px;
            cursor: pointer;
            opacity: .55;
            border: 2px solid transparent
        }

        .thumbs .on {
            opacity: 1;
            border-color: var(--acc)
        }

        .dlb {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 16px;
            background: var(--hot);
            color: #2a1100;
            font-weight: 800;
            margin-bottom: 10px
        }

        .dlb svg:last-child {
            margin-left: auto
        }

        .kv {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--line)
        }

        .kv:last-child {
            border: 0
        }

        .kv span {
            color: var(--mut)
        }

        .kv b {
            text-align: right
        }

        .rel {
            grid-column: 1/-1
        }

        .rel .grid {
            grid-template-columns: repeat(4, 1fr)
        }

        .code {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 12px;
            border-radius: 16px;
            background: var(--card2);
            margin-bottom: 9px
        }

        .code code {
            font: 700 14px ui-monospace, Consolas, monospace;
            background: var(--card);
            border: 1px solid var(--line);
            padding: 5px 12px;
            border-radius: 10px;
            color: var(--acc);
            white-space: nowrap
        }

        .code span {
            color: var(--mut);
            flex: 1
        }

        .cp {
            border: 0;
            border-radius: 99px;
            padding: 7px 14px;
            background: var(--acc);
            color: var(--onacc);
            font: 800 12px var(--fb);
            cursor: pointer;
            display: flex;
            gap: 6px;
            align-items: center
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .two .row,
        .row.ib2 {
            margin: 0
        }

        .ib {
            display: grid;
            place-items: center;
            background: var(--card);
            color: var(--acc)
        }

        .bar {
            height: 8px;
            border-radius: 9px;
            background: var(--card2);
            margin: 4px 0 12px
        }

        .bar i {
            display: block;
            height: 100%;
            border-radius: 9px;
            background: var(--acc)
        }

        .pg-n {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 18px
        }

        .pg-n span {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--card2);
            font-weight: 700;
            color: var(--mut)
        }

        .pg-n .on {
            background: var(--acc);
            color: var(--onacc)
        }



        #app {
            flex: 1;
            display: flex;
            flex-direction: column
        }

        .mg {
            width: 100%
        }

        .ban>* {
            position: relative;
            z-index: 1
        }

        .ban>.bg {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            z-index: 0
        }

        .ban>.o {
            position: absolute
        }

        .ban>.luma {
            position: absolute;
            z-index: 2
        }

        .bg>div {
            position: absolute;
            inset: 0
        }

        .bgi {
            background-size: cover;
            background-position: center
        }

        .ov {
            background: linear-gradient(90deg, rgba(0, 0, 0, .5), transparent 70%)
        }

        .avc {
            left: auto !important;
            width: 520px
        }

        .avt {
            left: auto !important;
            width: 340px;
            background-position: center 20%;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 55%);
            mask-image: linear-gradient(90deg, transparent, #000 55%)
        }

        .chips a {
            padding: 6px 13px;
            border-radius: 99px;
            background: var(--card2);
            font-weight: 700;
            font-size: 13px;
            color: var(--mut)
        }

        .chips a.on,
        .chips a:hover {
            background: var(--acc);
            color: var(--onacc)
        }

        .pg-n a {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--card2);
            font-weight: 700;
            color: var(--mut)
        }

        .pg-n a.on {
            background: var(--acc);
            color: var(--onacc)
        }

        .sr input {
            all: unset;
            flex: 1;
            color: var(--tx)
        }

        select.fld {
            width: 100%;
            cursor: pointer
        }

        .agrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px
        }

        .ac {
            text-align: center;
            padding: 18px;
            border-radius: 18px;
            background: var(--card2);
            display: block
        }

        .ac .av {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            margin: 0 auto 8px;
            border: 3px solid var(--acc2)
        }

        .ac b {
            display: block
        }

        .ac small {
            color: var(--mut)
        }

        .cp em {
            font-style: normal
        }

        .logo b i {
            display: inline-block
        }

        #toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 99px;
            padding: 8px 18px;
            font-weight: 700;
            box-shadow: var(--sh);
            opacity: 0;
            transform: translateY(10px);
            transition: .2s;
            pointer-events: none;
            z-index: 20
        }

        #toast.show {
            opacity: 1;
            transform: none
        }

        #toast img {
            height: 56px
        }

        .row.ib2 {
            margin: 0
        }

        a.au {
            color: inherit
        }

        [style*="background-image"] {
            background-size: cover;
            background-position: center
        }

        .avt {
            background-position: center 20% !important
        }

        @media(max-width:1100px) {
            .agrid {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        html {
            scroll-behavior: smooth
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--line) transparent
        }

        ::-webkit-scrollbar {
            width: 12px;
            height: 12px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 99px;
            border: 3px solid var(--bg)
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--acc)
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 2px
        }

        .mg.b {
            grid-template-rows: auto 1fr
        }

        .ban.nl {
            margin-top: 8px
        }

        .grid {
            grid-template-columns: repeat(4, 1fr)
        }

        @media(max-width:1450px) {
            .grid {
                grid-template-columns: repeat(3, 1fr)
            }

            .rel .grid {
                grid-template-columns: repeat(4, 1fr)
            }
        }

        #app>.mg {
            animation: pgin .4s cubic-bezier(.2, .8, .2, 1) both
        }

        @keyframes pgin {
            from {
                opacity: 0;
                transform: translateY(10px)
            }
        }

        .cc {
            display: block;
            transition: transform .25s cubic-bezier(.2, .8, .2, 1);
            animation: rise .45s cubic-bezier(.2, .8, .2, 1) both;
            animation-delay: calc(var(--i, 0)*45ms)
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px)
            }
        }

        .cc:hover {
            transform: translateY(-5px)
        }

        .cc .th {
            overflow: hidden;
